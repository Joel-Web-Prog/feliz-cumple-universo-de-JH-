<html lang="es"><head>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body><section id="cover">
<div class="cover-box"><small>UNA EXPERIENCIA ENTRE LAS ESTRELLAS</small>
<h1>Feliz cumpleaños<br><span>Jhoana</span> 💗</h1>
<p>No se me olvidó.<br>Prepárate para una inmersión mágica,<br>un paseo por mi universo.</p>
<button id="enter">Ingresar al universo ✦</button></div></section>
<main id="world" class="hide"><canvas id="space"></canvas>

 </section>
